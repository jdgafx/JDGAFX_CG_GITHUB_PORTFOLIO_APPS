[build]
  command = "npm run build"
  publish = "dist"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Fonts come from Google Fonts only: its stylesheet and its font files. The
    # PDF worker is bundled locally, and /api/ai is same-origin. The browser reads Wikipedia's
    # public API and arXiv's PDFs directly, so those two hosts are allowed in connect-src. Inline styles are
    # required because the UI sets some element styles through React style props.
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://en.wikipedia.org https://arxiv.org; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"

# A path under /api that no function serves is a 404, not the app page. /api/ai is a function and
# is matched before these rules.
[[redirects]]
  from = "/api/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
