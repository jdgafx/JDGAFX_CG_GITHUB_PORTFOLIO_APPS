[build]
  command = "npm run build"
  publish = "dist"
  ignore = "[ \"$CONTEXT\" = production ] && ! git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ../shared && exit 1; exit 0"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data:; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://api.npmjs.org https://raw.githubusercontent.com"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
