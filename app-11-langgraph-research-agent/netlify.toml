[build]
  command = "npm run build"
  publish = "dist"
  # Exit 0 skips the build, anything else builds. Previews are skipped. With no build cache Netlify gives no earlier commit
  # (CACHED_COMMIT_REF empty or equal to COMMIT_REF): the diff then compares a commit with itself, so build instead.
  ignore = "[ \"$CONTEXT\" = production ] || exit 0; [ -n \"$CACHED_COMMIT_REF\" ] && [ \"$CACHED_COMMIT_REF\" != \"$COMMIT_REF\" ] || exit 1; git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ../shared"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data:; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://en.wikipedia.org https://raw.githubusercontent.com"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
