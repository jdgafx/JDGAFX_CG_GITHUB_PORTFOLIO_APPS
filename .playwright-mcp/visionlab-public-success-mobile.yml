                - strong [ref=e147] [box=36,2870,54,17]: "Bottom:"
                - text: A floating, fixed action bar stretches across the bottom, featuring teal circular icons (play/stop, mic, settings, eye, history) and a "View" button on the far right.
            - paragraph [ref=e148] [box=16,2990,358,207]:
              - strong [ref=e149] [box=16,2993,61,17]: Lighting
              - text: The lighting in this image is completely flat and digital. There are no shadows or gradients simulating real-world light. The image relies instead on high contrast between the dark background and the bright text and colored UI elements to create depth and guide the eye. The "light" feels like it is emitting from the text and the glowing green and teal buttons.
