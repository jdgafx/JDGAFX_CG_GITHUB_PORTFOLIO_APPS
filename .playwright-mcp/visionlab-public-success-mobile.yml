              - listitem [ref=e140] [box=32,2394,342,92]:
                - strong [ref=e141] [box=36,2397,31,17]: "Top:"
                - text: A thin header bar spanning the full width containing the app name and primary action buttons. Below this is a search/task input bar.
              - listitem [ref=e142] [box=32,2491,342,184]:
                - strong [ref=e143] [box=36,2494,146,17]: "Left Column (Main):"
                - text: This section takes up approximately 70% of the screen. It features a tabbed interface (Overview, Instructions, Terminal), with "Terminal" actively selected. This area is filled with dense, monospaced text detailing the bot's actions, including a simulated conversation and massive log dumps of JSON and stack traces.
              - listitem [ref=e144] [box=32,2679,342,184]:
                - strong [ref=e145] [box=36,2682,177,17]: "Right Column (Sidebar):"
                - text: "This takes up the remaining 30%. It contains two distinct sections: \"Parameters\" (with collapsible fields like Name, Description, Inputs, and Prompts) and \"Reasoning Details\" (listing the AI's step-by-step internal thoughts like \"Search google for BrowseBot...\" or \"Install dependencies\")."
