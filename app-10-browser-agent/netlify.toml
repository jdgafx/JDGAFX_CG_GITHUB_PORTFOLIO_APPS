[build]
  command = "npm run build"
  publish = "dist"
  # Exit 0 skips the build, anything else builds. Previews are skipped. With no build cache Netlify gives no earlier commit
  # (CACHED_COMMIT_REF empty or equal to COMMIT_REF): the diff then compares a commit with itself, so build instead.
  ignore = "[ \"$CONTEXT\" = production ] || exit 0; [ -n \"$CACHED_COMMIT_REF\" ] && [ \"$CACHED_COMMIT_REF\" != \"$COMMIT_REF\" ] || exit 1; git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ../shared"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Chromium ships as compressed files next to its package. They are not bundled, so the package stays external and its
# files are included. Only the run function needs them: the planner function stays small.
[functions.execute]
  external_node_modules = ["@sparticuz/chromium"]
  included_files = ["node_modules/@sparticuz/chromium/bin/**"]

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
