[build]
  command = "npm run build"
  publish = "dist"
  ignore = "[ \"$CONTEXT\" = production ] && ! git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ../shared && exit 1; exit 0"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
